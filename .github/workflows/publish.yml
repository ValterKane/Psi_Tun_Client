name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Версия ядра прибита к той, что прошла стенд. REALITY-интероп с Xray-сервером
  # зависит от поведения ядра (группа X25519MLKEM768 в ClientHello, версия в
  # SessionId), поэтому сборка релиза не должна уезжать на произвольный latest.
  MIHOMO_VERSION: v1.19.32

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish self-contained
        run: dotnet publish PsiTun.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:InformationalVersion=${{ env.VERSION }} -o publish

      - name: Prepare directories
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path publish/mihomo

      - name: Download mihomo
        shell: pwsh
        run: |
          # Прямые download-URL, без api.github.com — тот в РФ режется.
          # Имя ассета точное: у релиза 127 ассетов с пересекающимися именами
          # (go120..go125, микро-архитектуры v1/v2/v3, -compatible), поиск по
          # подстроке взял бы вариант с чужой микро-архитектурой.
          $assetName = "mihomo-windows-amd64-$env:MIHOMO_VERSION.zip"
          $url = "https://github.com/MetaCubeX/mihomo/releases/download/$env:MIHOMO_VERSION/$assetName"
          Invoke-WebRequest $url -OutFile mihomo.zip
          Expand-Archive mihomo.zip -DestinationPath mihomo-tmp -Force
          # В архиве один файл mihomo-windows-amd64.exe — имя не то, что нужно приложению
          $src = Get-ChildItem mihomo-tmp -Recurse -Filter "mihomo-*.exe" | Select-Object -First 1
          if (-not $src) { throw "mihomo exe not found in $assetName" }
          Move-Item $src.FullName publish/mihomo/mihomo.exe -Force
          Remove-Item mihomo-tmp -Recurse -Force
          Remove-Item mihomo.zip

      - name: Download Runetfreedom geo
        shell: pwsh
        run: |
          $geoUrl = "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat"
          $ipUrl = "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat"
          # mihomo читает geoip.dat/geosite.dat из каталога -d, то есть рядом с config.yaml
          Invoke-WebRequest $geoUrl -OutFile publish/mihomo/geosite.dat
          Invoke-WebRequest $ipUrl -OutFile publish/mihomo/geoip.dat

      - name: Verify package contents
        shell: pwsh
        run: |
          # Архив обязан быть самодостаточным: у пользователя без рабочего туннеля
          # докачать ядро или гео-данные неоткуда.
          $needed = @(
            'publish/PsiTun.exe',
            'publish/mihomo/mihomo.exe',
            'publish/mihomo/geoip.dat',
            'publish/mihomo/geosite.dat'
          )
          foreach ($f in $needed) {
            if (-not (Test-Path $f)) { throw "missing in package: $f" }
          }
          $v = & ./publish/mihomo/mihomo.exe -v
          Write-Host "bundled core: $v"
          if ("$v" -notmatch [regex]::Escape($env:MIHOMO_VERSION.TrimStart('v'))) {
            throw "bundled core version mismatch: $v (expected $env:MIHOMO_VERSION)"
          }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath PsiTun.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PsiTun ${{ github.ref_name }}
          files: PsiTun.zip
          draft: false
          prerelease: false
